[project]
name = "dc03"
version = "0.0.1"
description = "Linux controller for the iBasso DC03 Pro USB DAC"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jordi Monfar" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.scripts]
dc03 = "dc03.cli.main:main"

[project.urls]
Homepage = "https://github.com/jmonfar/ibasso-dc03-pro-linux"
Repository = "https://github.com/jmonfar/ibasso-dc03-pro-linux"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc03"]
