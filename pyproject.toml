[project]
name = "dc03"
version = "0.2.0"
description = "Linux controller for the iBasso DC03 Pro USB DAC"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jordi Monfar" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.scripts]
dc03 = "dc03.cli.main:main"

[project.urls]
Homepage = "https://github.com/jmonfar/ibasso-dc03-pro-linux"
Repository = "https://github.com/jmonfar/ibasso-dc03-pro-linux"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc03"]

# Bundle the udev rule and systemd unit templates inside the wheel so the
# `dc03 install-system` subcommand can read them via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/dc03/_data/udev/70-ibasso-dc03-pro.rules" = "dc03/_data/udev/70-ibasso-dc03-pro.rules"
"src/dc03/_data/systemd/dc03-restore@.service" = "dc03/_data/systemd/dc03-restore@.service"
"src/dc03/_data/systemd/dc03-watch@.service"   = "dc03/_data/systemd/dc03-watch@.service"

[tool.pytest.ini_options]
testpaths = ["tests"]
